# Builds the Windows desktop client (windows/) and uploads the
# resulting .msi + .exe as a workflow artifact. Run manually via the
# Actions tab — there's no prod auto-deploy for the desktop client;
# the operator downloads the artifact, smoke-tests it, then uploads
# the .msi to MinIO under releases/win/ (similar to the macOS
# release flow).
#
# Triggers:
#   - manual (workflow_dispatch) for any push to main
#   - on tag v-win-* if you want versioned releases
name: Windows desktop build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v-win-*'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: windows/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('windows/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri bundle
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperExchange-Windows-installers
          path: |
            windows/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            windows/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
