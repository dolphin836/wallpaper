# Prod host is a 2-core / 7.4G VPS shared with other apps; every service
# gets a hard memory cap so one runaway container (ffmpeg transcode, Kafka
# heap, query spike) cannot OOM the whole box, and json-file log rotation
# so container logs can't fill the 40G root disk again.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallpaper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallpaper}
      POSTGRES_DB: ${POSTGRES_DB:-wallpaper}
    # Bind to host loopback only — lets the operator SSH-tunnel in for
    # one-off CLI work (e.g. running cmd/autotag from outside-China to
    # reach Anthropic's API while still hitting the prod DB). The 0.0.0.0
    # interface is intentionally not exposed.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deployments/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallpaper}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    command: >
      sh -c '
        if [ -n "$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$REDIS_PASSWORD"
        else
          redis-server
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: wallpaper_minio
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"
    command: server /data --console-address ":9001"
    networks:
      - default
      - caddy_shared
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    # Persist the KRaft log dir. Without a volume every container
    # recreate boots a blank broker: queued events and consumer offsets
    # vanish, and workers that join during the cold-start window can
    # stall in kafka-go silently (2026-06-12: five videos stuck in
    # processing for 37h after the 06-10 deploy recreated kafka).
    # /var/lib/kafka/data exists appuser-owned in the image, so the
    # named volume inherits writable ownership on first use.
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      # Default Kafka heap is 1G which would blow straight through the
      # container cap; a single-broker dev-scale install runs fine on 512m.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    container_name: wallpaper_api
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.5"
    networks:
      - default
      - caddy_shared
    environment:
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-wallpaper}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-wallpaper}
      DB_NAME: ${POSTGRES_DB:-wallpaper}
      DB_SSLMODE: disable
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-wallpapers}
      MINIO_PUBLIC_URL: "https://${SITE_DOMAIN:-localhost}/storage"
      KAFKA_BROKERS: "kafka:9092"
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-string}
      JWT_EXPIRE_HOUR: ${JWT_EXPIRE_HOUR:-24}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_ADMIN_API_KEY: ${ANTHROPIC_ADMIN_API_KEY:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      INDEXNOW_SITE_URL: ${INDEXNOW_SITE_URL:-https://wallpaperexchange.com}
      TUS_TMP_DIR: "/var/lib/wpe/tus"
    volumes:
      # Resumable video uploads stage chunks here. Volume so an
      # in-flight upload survives an api container restart and the
      # client can resume.
      - tus_data:/var/lib/wpe/tus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    logging: *default-logging
    deploy:
      resources:
        # ffmpeg transcode + image decode are the heaviest jobs on the box.
        limits:
          memory: 2g
          cpus: "1.5"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-wallpaper}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-wallpaper}
      DB_NAME: ${POSTGRES_DB:-wallpaper}
      DB_SSLMODE: disable
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-wallpapers}
      MINIO_PUBLIC_URL: "https://${SITE_DOMAIN:-localhost}/storage"
      KAFKA_BROKERS: "kafka:9092"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      INDEXNOW_SITE_URL: ${INDEXNOW_SITE_URL:-https://wallpaperexchange.com}
      TRANSCODE_WORK_DIR: "/var/lib/wpe/transcode"
    volumes:
      - transcode_data:/var/lib/wpe/transcode
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wallpaper_frontend
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
    networks:
      - default
      - caddy_shared
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  minio_data:
  tus_data:
  transcode_data:
  kafka_data:

networks:
  caddy_shared:
    external: true
