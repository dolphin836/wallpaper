# Bots that don't run JS — route them to the backend's prerender endpoint so
# OG/Twitter/JSON-LD meta is visible without executing the SPA.
map $http_user_agent $is_meta_bot {
    default                    0;
    "~*facebookexternalhit"    1;
    "~*Facebot"                1;
    "~*Twitterbot"             1;
    "~*WhatsApp"               1;
    "~*TelegramBot"            1;
    "~*LinkedInBot"            1;
    "~*Discordbot"             1;
    "~*Slackbot"               1;
    "~*Pinterest"              1;
    "~*Applebot"               1;
    "~*WeChat"                 1;
    "~*MicroMessenger"         1;
    "~*Weibo"                  1;
    "~*Bytespider"             1;
    "~*Bingbot"                1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /robots.txt {
        proxy_pass http://api:8080/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://api:8080/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Wallpaper detail pages: bots get the prerendered OG HTML from the api,
    # everyone else gets the SPA which fills the same meta client-side.
    location ~ ^/wallpaper/(?<wp_slug>[^/]+)/?$ {
        if ($is_meta_bot = 1) {
            rewrite ^.*$ /__og/wallpaper/$wp_slug last;
        }
        try_files $uri /index.html;
    }

    location ^~ /__og/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
