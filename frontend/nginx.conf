# Bots that don't run JS — route them to the backend's prerender endpoint so
# OG/Twitter/JSON-LD meta is visible without executing the SPA. Googlebot
# does render JS, but serving it pre-rendered HTML still cuts indexing
# latency from "minutes-to-days" down to first-crawl. Same payload as a
# user-visible page, just collapsed into static markup — no cloaking risk.
map $http_user_agent $is_meta_bot {
    default                    0;
    "~*facebookexternalhit"    1;
    "~*Facebot"                1;
    "~*Twitterbot"             1;
    "~*WhatsApp"               1;
    "~*TelegramBot"            1;
    "~*LinkedInBot"            1;
    "~*Discordbot"             1;
    "~*Slackbot"               1;
    "~*Pinterest"              1;
    "~*Applebot"               1;
    "~*WeChat"                 1;
    "~*MicroMessenger"         1;
    "~*Weibo"                  1;
    "~*Bytespider"             1;
    "~*Bingbot"                1;
    "~*Googlebot"              1;
    "~*Google-InspectionTool"  1;
    "~*AdsBot-Google"          1;
    "~*DuckDuckBot"            1;
    "~*YandexBot"              1;
    "~*Baiduspider"            1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /robots.txt {
        proxy_pass http://api:8080/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://api:8080/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /feed.xml {
        proxy_pass http://api:8080/feed.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # IndexNow verification key file (Bing/Yandex). Hex name only — we
    # match the exact shape so curious crawlers poking at random.txt
    # paths still get the SPA index, not a confusing 404 from the API.
    # Quoted regex: nginx otherwise parses the `{16,128}` quantifier as
    # the start of a config block and emerges with an "unknown directive"
    # error at startup. Quoting tells the parser it's all one string.
    location ~ "^/[a-fA-F0-9]{16,128}\.txt$" {
        proxy_pass http://api:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Wallpaper detail pages: bots get the prerendered OG HTML from the api,
    # everyone else gets the SPA which fills the same meta client-side.
    location ~ ^/wallpaper/(?<wp_slug>[^/]+)/?$ {
        if ($is_meta_bot = 1) {
            rewrite ^.*$ /__og/wallpaper/$wp_slug last;
        }
        try_files $uri /index.html;
    }

    location ^~ /__og/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
